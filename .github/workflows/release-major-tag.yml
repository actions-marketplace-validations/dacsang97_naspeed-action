name: release major tag

run-name: Move ${{ github.event.inputs.major_version }} to ${{ github.event.inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: The tag, branch, or SHA the major version should point to (e.g. v1.0.0)
        required: true
      major_version:
        type: choice
        description: The major version tag to move
        options:
          - v1

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.event.inputs.target }}
      MAJOR: ${{ github.event.inputs.major_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move ${{ github.event.inputs.major_version }} to ${{ github.event.inputs.target }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$TARGET"
          git push origin "$MAJOR" --force
